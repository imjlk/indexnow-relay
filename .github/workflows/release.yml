name: Release

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write # tags and releases
  pull-requests: write # release PRs

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Sampo release automation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for changelog links/acknowledgments

      # - push to main with pending changesets -> opens/updates a release PR
      # - merge of a release PR -> sampo bumps versions + CHANGELOG.md
      - name: Run Sampo auto
        id: sampo
        uses: bruits/sampo/crates/sampo-github-action@main
        with:
          command: auto
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The npm package is private on purpose (releases ship as tags + the
      # GHCR image, never to the npm registry), so `sampo publish` has no
      # registry step to run and creates no tag. Create it here instead:
      # whenever the committed version has no tag yet, tag it. Merging a
      # release PR bumps the version, so the tag - and with it the Docker
      # workflow that publishes the image and the GitHub release - follows
      # every release exactly once.
      - name: Ensure vX.Y.Z tag exists for the current version
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('package.json'))['version'])")
          if ! git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            git config user.name "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git tag "v$VERSION"
            git push origin "v$VERSION"
            echo "tagged v$VERSION"
          else
            echo "v$VERSION already tagged"
          fi
