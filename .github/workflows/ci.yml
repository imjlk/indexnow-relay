name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck (ttsc + typia)
        run: bun run typecheck

      - name: Lint + evidence gate (ttsc + @ttsc/lint)
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build production bundle
        run: bun run build

      - name: Smoke test the built server
        run: |
          cat > relay.config.ts <<'EOF'
          import { defineConfig, env } from './dist/config/index.js'

          export default defineConfig({
            auth: env('INDEXNOW_RELAY_TOKEN'),
            sites: { 'www.example.com': env('INDEXNOW_KEY_WWW_EXAMPLE_COM') },
          })
          EOF
          export INDEXNOW_RELAY_TOKEN=ci-token-0000000000001
          export INDEXNOW_KEY_WWW_EXAMPLE_COM=a1b2c3d4e5f60718
          export PORT=3199
          bun dist/server.js &
          SERVER_PID=$!
          sleep 2
          curl -fsS http://localhost:3199/healthz > /dev/null
          curl -fsS http://localhost:3199/readyz > /dev/null
          curl -fsS http://localhost:3199/openapi.json > /dev/null
          curl -fsS -X POST http://localhost:3199/v1/urls \
            -H "Authorization: Bearer $INDEXNOW_RELAY_TOKEN" \
            -H 'content-type: application/json' \
            -d '{"urls":["https://www.example.com/ci-smoke"]}' | grep -q receiptId
          kill $SERVER_PID

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
