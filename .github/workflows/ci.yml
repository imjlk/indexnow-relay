name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.0

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Typecheck (ttsc + typia)
        run: bun run typecheck

      - name: Lint + evidence gate (ttsc + @ttsc/lint)
        run: bun run lint

      - name: Test
        run: bun run test

      - name: Build production bundle
        run: bun run build

      - name: Smoke test deployment boundaries (env config, restart, db upgrade, conflict, alt port)
        run: bash scripts/ci-smoke.sh dist

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 7

  docker:
    name: Docker image build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: indexnow-relay:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the built image (env config, PORT, healthcheck port parity)
        run: |
          # a stand-in IndexNow endpoint on the runner host
          python3 - <<'PY' &
          import http.server, socketserver
          class OK(http.server.BaseHTTPRequestHandler):
              def do_POST(self):
                  self.send_response(200); self.end_headers()
              def log_message(self, *args): pass
          with socketserver.TCPServer(("127.0.0.1", 3188), OK) as httpd:
              httpd.serve_forever()
          PY
          STUB_PID=$!
          sleep 1

          docker run -d --name relay-smoke --network host \
            -e INDEXNOW_SITES='{"www.example.com":"a1b2c3d4e5f60718"}' \
            -e INDEXNOW_RELAY_TOKEN=ci-token-0000000000001 \
            -e INDEXNOW_ENDPOINT='http://127.0.0.1:3188/indexnow' \
            -e PORT=3213 \
            indexnow-relay:smoke
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:3213/healthz > /dev/null 2>&1 && break
            sleep 1
          done
          curl -fsS http://127.0.0.1:3213/readyz > /dev/null
          curl -fsS -X POST http://127.0.0.1:3213/v1/urls \
            -H "Authorization: Bearer ci-token-0000000000001" \
            -H 'content-type: application/json' \
            -d '{"urls":["https://www.example.com/image-smoke"]}' | grep -q receiptId
          # the image healthcheck probes the same PORT the server listens on;
          # poll instead of sleeping - probe intervals are 30s after start period
          for i in $(seq 1 90); do
            HEALTH="$(docker inspect -f '{{.State.Health.Status}}' relay-smoke)"
            [ "$HEALTH" = "healthy" ] && break
            if [ "$HEALTH" = "unhealthy" ]; then
              docker logs relay-smoke
              echo "smoke: container became unhealthy" >&2
              exit 1
            fi
            sleep 1
          done
          if [ "$HEALTH" != "healthy" ]; then
            docker logs relay-smoke
            echo "smoke: container never reached healthy" >&2
            exit 1
          fi
          docker rm -f relay-smoke
          kill $STUB_PID
